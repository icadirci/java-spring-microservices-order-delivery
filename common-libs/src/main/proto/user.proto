syntax = "proto3";

package com.orderplatform.common.grpc;


option java_multiple_files = true;
option java_package = "com.orderplatform.common.grpc";
option java_outer_classname = "UserProto";


service UserServiceGrpcNav {
    rpc GetUserById (UserRequest) returns (UserResponse);
}

message UserRequest {
    string id = 1;
}

message UserResponse {
    string id = 1;
    bool enabled = 2;
    string username = 3;
    string email = 4;
}
